[project]
name = "wikitui"
version = "0.1.0"
description = "Terminal browser for a BookStack wiki, with Markdown rendering"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "markdownify>=0.13",
    "textual>=0.80",
]

[project.scripts]
wikitui = "wikitui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
